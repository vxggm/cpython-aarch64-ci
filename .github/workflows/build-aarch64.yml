name: build-python-aarch64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            p7zip-full gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            qemu-user-static file

      - name: Extract source
        run: |
          7z x -y cpython-main.7z > /dev/null
          SRC=$(ls -d cpython-*/ 2>/dev/null | head -1 | sed 's#/$##')
          if [ -z "$SRC" ]; then
            SRC=$(find . -maxdepth 2 -name configure -printf '%h\n' | head -1 | sed 's#^\./##')
          fi
          echo "SRC=$SRC" | tee -a "$GITHUB_ENV"
          echo "--- top of source ---"
          ls "$SRC" | head -5

      - name: Configure (cross aarch64)
        run: |
          cd "$SRC"
          ./configure --host=aarch64-linux-gnu --build=x86_64-linux-gnu \
            --prefix=/opt/python-aarch64 --disable-ipv6 \
            --disable-test-modules --without-ensurepip \
            ac_cv_file__dev_ptmx=yes ac_cv_file__dev_ptc=no \
            ac_cv_buggy_getaddrinfo=no \
            > /tmp/configure.log 2>&1 || { tail -50 /tmp/configure.log; exit 1; }
          tail -12 /tmp/configure.log

      - name: Build
        run: |
          cd "$SRC"
          make -j"$(nproc)" > /tmp/make.log 2>&1 || { tail -80 /tmp/make.log; exit 1; }
          tail -5 /tmp/make.log

      - name: Smoke test under qemu
        run: |
          cd "$SRC"
          file ./python
          qemu-aarch64 -L /usr/aarch64-linux-gnu ./python -c \
            'import sys, platform; print("version", sys.version.split()[0], "arch", platform.machine())'

      - name: Install to staging
        run: |
          cd "$SRC"
          make install DESTDIR=/root/stage > /tmp/install.log 2>&1 || { tail -40 /tmp/install.log; exit 1; }
          du -sh /root/stage/opt/python-aarch64
          ls /root/stage/opt/python-aarch64/bin | head -10

      - name: Package
        run: |
          cd /root/stage/opt/python-aarch64
          tar czf "$GITHUB_WORKSPACE/python-aarch64-custom.tar.gz" .
          ls -l "$GITHUB_WORKSPACE/python-aarch64-custom.tar.gz"

      - name: Dump logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            /tmp/configure.log
            /tmp/make.log
            /tmp/install.log
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-aarch64-build
          path: python-aarch64-custom.tar.gz
          retention-days: 30
