name: build-python-aarch64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare cross build environment
        run: |
          set -x
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config unzip file qemu-user qemu-user-static \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross

          # ---- arm64 目标开发库：交叉编译 _ssl/_sqlite3/_bz2/_lzma/_ctypes/_zlib 必须要 ----
          sudo dpkg --add-architecture arm64
          # 所有 amd64 源显式限定架构，否则 apt 会去 security.ubuntu.com 要 arm64 索引（404）
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
            [ -f "$f" ] && sudo sed -i -E 's/^deb(-src)?[[:space:]]+([^[])/deb\1 [arch=amd64] \2/' "$f" || true
          done
          printf '%s\n' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse' \
            | sudo tee /etc/apt/sources.list.d/arm64-ports.list > /dev/null
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libc6:arm64 libssl-dev:arm64 zlib1g-dev:arm64 libffi-dev:arm64 \
            libbz2-dev:arm64 liblzma-dev:arm64 libsqlite3-dev:arm64 \
            libncursesw5-dev:arm64 libreadline-dev:arm64 uuid-dev:arm64

          # ---- 编译器自检：链接不出可执行文件时立刻暴露，并把日志留给 artifact ----
          {
            echo 'int main(void){return 0;}' > /tmp/t.c
            aarch64-linux-gnu-gcc /tmp/t.c -o /tmp/t
            echo "cc_exit=$?"
            file /tmp/t
            aarch64-linux-gnu-gcc -v
          } > /tmp/env-toolchain.log 2>&1 || true
          tail -25 /tmp/env-toolchain.log
          test -x /tmp/t

          {
            echo "sysroot: $(aarch64-linux-gnu-gcc -print-sysroot)"
            ls /usr/aarch64-linux-gnu | head -10
            ls /usr/lib/aarch64-linux-gnu/pkgconfig | head -20
          } > /tmp/env-libs.log 2>&1 || true
          tail -15 /tmp/env-libs.log

      - name: Extract source
        run: |
          unzip -q cpython-main.zip
          echo "SRC=cpython-main" >> "$GITHUB_ENV"
          ls cpython-main | head -8

      - name: Build host python (needed as --with-build-python)
        run: |
          set -x
          exec > >(tee /tmp/host.log) 2>&1
          cp -a "$SRC" "$RUNNER_TEMP/host_src"
          cd "$RUNNER_TEMP/host_src"
          chmod +x configure
          ./configure --without-ensurepip --disable-test-modules
          make -j"$(nproc)"
          "$RUNNER_TEMP/host_src/python" -c 'import sys; print("host python", sys.version.split()[0])'

      - name: Configure (cross aarch64)
        run: |
          set -x
          cd "$SRC"
          chmod +x configure
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/
          ./configure --host=aarch64-linux-gnu --build=x86_64-linux-gnu \
            --with-build-python="$RUNNER_TEMP/host_src/python" \
            --prefix=/opt/python-aarch64 \
            --disable-test-modules \
            --without-ensurepip \
            ac_cv_file__dev_ptmx=yes ac_cv_file__dev_ptc=no \
            ac_cv_buggy_getaddrinfo=no \
            > /tmp/configure.log 2>&1 || {
              tail -40 /tmp/configure.log
              echo '=== config.log tail ==='
              tail -80 config.log 2>/dev/null
              cp -f config.log /tmp/config.log 2>/dev/null
              exit 1
            }
          tail -25 /tmp/configure.log

      - name: Build
        run: |
          cd "$SRC"
          make -j"$(nproc)" > /tmp/make.log 2>&1 || { tail -80 /tmp/make.log; exit 1; }
          tail -5 /tmp/make.log

      - name: Smoke test under qemu
        run: |
          cd "$SRC"
          file ./python
          # qemu-user-static 装出来的名字是 qemu-aarch64-static，两种都试
          QEMU=$(command -v qemu-aarch64 || command -v qemu-aarch64-static || true)
          echo "qemu=$QEMU"
          test -n "$QEMU"
          "$QEMU" -L /usr/aarch64-linux-gnu ./python -c \
            'import sys, platform; print("version", sys.version.split()[0], "arch", platform.machine())'

      - name: Install to staging
        run: |
          cd "$SRC"
          make install DESTDIR="$RUNNER_TEMP/stage" > /tmp/install.log 2>&1 || { tail -40 /tmp/install.log; exit 1; }
          du -sh "$RUNNER_TEMP/stage/opt/python-aarch64"
          ls "$RUNNER_TEMP/stage/opt/python-aarch64/bin" | head -10
          echo '--- built extension modules ---'
          ls "$RUNNER_TEMP/stage/opt/python-aarch64/lib/python"*/lib-dynload/*.so 2>/dev/null | wc -l

      - name: Strip and slim
        run: |
          set -x
          S="$RUNNER_TEMP/stage/opt/python-aarch64"
          cd "$S"
          du -sh . || true

          # 1) 去掉符号与调试信息（体积大头）
          aarch64-linux-gnu-strip --strip-unneeded bin/python3.16 || true
          find . -type f -name '*.so*' -exec aarch64-linux-gnu-strip --strip-unneeded {} + 2>/dev/null || true

          # 2) 删掉运行时用不到的东西（对齐 astral 的 install_only_stripped）
          find . -type d -name '__pycache__' -prune -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name '*.pyc' -delete 2>/dev/null || true
          find . -type d \( -name test -o -name tests -o -name idle_test \) -prune -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name '*.a' -delete 2>/dev/null || true
          rm -rf include share/man share/doc lib/pkgconfig 2>/dev/null || true

          echo '--- after slim ---'
          du -sh .
          du -sh bin lib 2>/dev/null || true
          file bin/python3.16

      - name: Package
        run: |
          cd "$RUNNER_TEMP/stage/opt/python-aarch64"
          tar czf "$GITHUB_WORKSPACE/python-aarch64-slim.tar.gz" .
          ls -l "$GITHUB_WORKSPACE/python-aarch64-slim.tar.gz"

      - name: Dump logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: /tmp/*.log
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-aarch64-build
          path: python-aarch64-slim.tar.gz
          retention-days: 30